Section "Device"
    Identifier  "Simpledrm"
    Driver      "modesetting"
    Option      "kmsdev" "/dev/dri/card0"
EndSection

Section "Screen"
    Identifier  "DefaultScreen"
    Device      "Simpledrm"
    DefaultDepth 24
EndSection

Section "ServerFlags"
    Option      "DontZap" "on"
EndSection
