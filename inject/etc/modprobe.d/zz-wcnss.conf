# Le pilote WCNSS ne doit pas etre charge automatiquement par udev des le
# demarrage : a cet instant le firmware n'est pas encore installe dans
# /lib/firmware et le probe echouerait definitivement (le noyau ne reessaie pas).
# wcnss-firmware.service les charge lui-meme, apres avoir depose les blobs.
# "blacklist" ne bloque que le chargement automatique : modprobe explicite
# fonctionne toujours.
blacklist qcom_wcnss_pil
blacklist wcn36xx
