# Nura : le bureau (root) retrouve le bus D-Bus de session et le serveur de son
# PipeWire de root, lances par son gestionnaire utilisateur (linger).
[Unit]
Wants=user@0.service
After=user@0.service

[Service]
Environment=XDG_RUNTIME_DIR=/run/user/0
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/0/bus
