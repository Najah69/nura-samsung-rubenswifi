# Nura : bouton marche de la tablette.
# Par defaut, systemd-logind eteint la machine au moindre appui sur Power.
# Ici : appui court = eteindre / rallumer l'ecran (gere par nura-energie),
# appui long (5 s) = arret propre de la tablette.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
