# Reglages de la tablette Nura (samsung-rubenswifi)
# Modifies par l'assistant Nura, ou a la main :
#   nura-config get CLE        nura-config set CLE VALEUR        nura-config list
#
# KB_LAYOUT     fr, us, de, es, ar (disposition du clavier X)
# TZ            fuseau horaire, ex. Europe/Paris
# NOM           nom de la tablette sur le reseau
# USER_LOGIN    compte utilisateur principal
# CLAVIER       on / off : clavier tactile affiche au demarrage
# ORIENTATION   paysage / portrait
#   Defaut PORTRAIT : au tout premier demarrage, l'ecran n'est pas tourne, donc
#   le tactile tombe juste sans aucune correction (c'est son repere natif). On
#   evite ainsi de livrer une tablette qu'on ne peut pas toucher si la
#   calibration du paysage echouait. L'assistant propose le paysage a l'etape
#   "orientation", et le passage se fait alors avec la matrice appliquee.
# AUTOMOUNT     1 / 0 : montage automatique des cartes SD et cles USB
# WIFI_AUTO     1 / 0 : relancer le Wi-Fi au demarrage
# RESEAU_USB    1 / 0 : reseau par cable USB actif au demarrage
# ASSISTANT_DONE 1 = assistant deja termine

KB_LAYOUT=fr
TZ=Europe/Paris
NOM=rubenswifi
USER_LOGIN=najah
CLAVIER=on
ORIENTATION=portrait
AUTOMOUNT=1
WIFI_AUTO=1
RESEAU_USB=0
ASSISTANT_DONE=0
