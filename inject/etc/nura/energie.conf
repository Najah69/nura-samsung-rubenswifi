# Reglages du service nura-energie (ecran, bouton marche, luminosite, batterie).
# Apres modification : sudo systemctl restart nura-energie

# Extinction de l'ecran apres ce nombre de secondes sans toucher l'ecran (0 = jamais).
ECRAN_DELAI=180
# oui : un appui sur l'ecran eteint le rallume aussi (non : seulement Power ou Accueil).
ECRAN_REVEIL_TACTILE=non

# Luminosite : cran des touches de volume et minimum (sur 255).
LUMINOSITE_PAS=20
LUMINOSITE_MIN=8

# Batterie (estimation par la tension, voir batterie.sh).
BATTERIE_ICONE=oui
BATTERIE_ALERTE=15
BATTERIE_CRITIQUE=3
# oui : arret propre automatique quand la batterie est presque vide.
ARRET_CRITIQUE=oui
