# Aucun reseau enregistre a la fabrication de l'image : c'est l'assistant, au
# premier demarrage, qui enregistre le Wi-Fi (mot de passe stocke hache par
# wpa_passphrase). Voir aussi : wifi.sh scan | wifi.sh connect SSID MOTDEPASSE
#
# Pour une image destinee a un seul reseau, on peut remplir ce fichier :
#   wpa_passphrase "MON-RESEAU" "motdepasse" >> ce-fichier
ctrl_interface=/run/wpa_supplicant
update_config=0
